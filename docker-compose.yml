version: '3.7'

services:
  app:
    build:
      dockerfile: './Dockerfile'
      context: '.'
    volumes:
      - type: bind
        source: './config.json'
        target: '/app/config.json'
        read_only: true
      - type: bind
        source: './channels.json'
        target: '/app/channels.json'
        read_only: true
    ports:
      - '5004:5004'
